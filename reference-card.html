<!--
  Reference card — a brief pop-in image for something the creator names on camera
  (a character, product, tool, person, place, website). Copy the three parts
  into index.html. One card per reference; give each a unique id (ref-<slug>).

  Placement: right side (clear of the creator's face), same zone as panels — never show a
  reference card and a right-side panel at the same time. Hold 1.5–3 s.
-->

<!-- 1) CSS (inside <style>) -->
<style>
  .ref .card { position: absolute; right: 70px; top: 220px; width: 420px; display: flex; flex-direction: column; align-items: center; }
  .ref .glow { position: absolute; top: 40px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(56, 130, 246, 0.55), rgba(56, 130, 246, 0) 70%); }
  .ref .img { position: relative; width: 380px; height: 380px; object-fit: contain; filter: drop-shadow(0 18px 30px rgba(11, 32, 88, 0.45)); }
  /* For photos/screenshots that keep their background, use .img.framed instead */
  .ref .img.framed { width: 400px; height: 260px; object-fit: cover; border-radius: 18px; border: 6px solid #ffffff; }
  .ref .tag { position: relative; margin-top: 10px; display: flex; flex-direction: column; align-items: center; background: rgba(11, 32, 88, 0.95); border-radius: 14px; padding: 10px 22px 12px; }
  .ref .name { font-family: "Poppins", Arial, sans-serif; font-weight: 800; font-size: 34px; color: #ffffff; line-height: 1.1; }
  .ref .sub { font-family: "Montserrat", Arial, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.14em; color: #3882f6; text-transform: uppercase; }
  .ref .credit { position: relative; margin-top: 6px; font-family: "Montserrat", Arial, sans-serif; font-weight: 500; font-size: 13px; color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
</style>

<!-- 2) HTML (inside #root). data-start = word time - 0.15; data-duration = 1.5–3 s -->
<div id="ref-charmeleon" class="clip ref" data-start="12.35" data-duration="2.6" data-track-index="16">
  <div class="card">
    <div class="glow"></div>
    <img class="img" src="assets/refs/charmeleon.png" alt="Charmeleon" />
    <div class="tag"><span class="name">Charmeleon</span><span class="sub">Fire-type Pokémon</span></div>
    <span class="credit">© Nintendo / The Pokémon Company</span>
  </div>
</div>

<!-- 3) JS (inside the timeline script, before window.__timelines registration) -->
<script>
  // Pop in with overshoot, idle float, pop out. Animates inner nodes only.
  function refCard(id, inAt, outAt) {
    tl.fromTo(`${id} .glow`, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, inAt);
    tl.fromTo(`${id} .img`, { scale: 0.3, opacity: 0, rotation: -8, y: 40 }, { scale: 1, opacity: 1, rotation: 0, y: 0, duration: 0.55, ease: "back.out(2)" }, inAt);
    tl.fromTo(`${id} .img`, { y: 0 }, { y: -10, duration: (outAt - inAt - 0.9) / 2, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, inAt + 0.55);
    tl.fromTo([`${id} .tag`, `${id} .credit`], { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out", stagger: 0.08 }, inAt + 0.25);
    tl.to(`${id} .card`, { scale: 0.85, opacity: 0, duration: 0.3, ease: "power2.in" }, outAt - 0.3);
  }
  refCard("#ref-charmeleon", 12.35, 14.95);
</script>
<!-- SFX: pop (or a fitting library clip) at inAt, data-volume ≈ 0.35, its own track -->
